[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advance-dispatch"
version = "0.1.0"
description = "AdVance Dispatch: scheduled HTML email briefings built from gold data."
requires-python = ">=3.14"
dynamic = ["dependencies"]

# The pinned list in requirements.txt is the one dependency list
[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

# Section partials and the email skeleton ship inside the package
[tool.setuptools.package-data]
dispatch = ["render/*.j2", "sections/*/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
