[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advance-dispatch"
version = "0.1.0"
description = "AdVance Dispatch: scheduled HTML email briefings built from gold data."
requires-python = ">=3.11"
dependencies = [
    "croniter>=2.0",
    "duckdb>=1.1",
    "google-auth>=2.30",
    "google-cloud-firestore>=2.16",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-storage>=2.17",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "premailer>=3.10",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pytz>=2024.1",
    "requests>=2.31",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

# Section partials and the email skeleton ship inside the package
[tool.setuptools.package-data]
dispatch = ["render/*.j2", "sections/*/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
